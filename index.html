<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة صنعاء التفاعلية</title>
    <!-- مكتبة Leaflet الأساسية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- مكتبة البحث المحلي في العناصر -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.css" />
    <!-- مكتبة البحث الجغرافي عن الأماكن والقرى (Geocoder) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .locate-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        }
        /* تعديل المظهر وضبط القوائم في الأعلى */
        .leaflet-top.leaflet-right {
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <button class="locate-btn" onclick="locateUser()">🎯 موقعي الحالي</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>
        var map = L.map('map').setView([15.369444, 44.191007], 12);

        // طبقة Google Satellite
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Google Satellite'
        }).addTo(map);

        var searchLayer = L.layerGroup().addTo(map);
        var files = ['2.json', '4.json', '5f.json', '6.json', '7.json'];
        
        // تحميل ملفات GeoJSON
        files.forEach(function(file) {
            fetch(file)
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: { color: "#ff7800", weight: 2, opacity: 0.8 },
                        onEachFeature: function (feature, layer) {
                            var propString = "";
                            if (feature.properties) {
                                var popupContent = "<table border='1' style='border-collapse:collapse; width:100%;'>";
                                for (var p in feature.properties) {
                                    propString += feature.properties[p] + " ";
                                    popupContent += "<tr><th style='padding:4px; background:#f0f0f0;'>" + p + "</th><td style='padding:4px;'>" + feature.properties[p] + "</td></tr>";
                                }
                                popupContent += "</table>";
                                layer.bindPopup(popupContent);
                            }
                            layer.title = propString.trim();
                            searchLayer.addLayer(layer);
                        }
                    });
                }).catch(err => console.log('Error: ' + file, err));
        });

        // 1. محرك البحث عن الأماكن والقرى الجغرافية (نقم، رهم، صنعاء...)
        var geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            position: 'topright',
            placeholder: '🔍 ابحث عن موقع (نقم، رهم...)'
        })
        .on('markgeocode', function(e) {
            var bbox = e.geocode.bbox;
            var poly = L.polygon([
                bbox.getSouthEast(),
                bbox.getNorthEast(),
                bbox.getNorthWest(),
                bbox.getSouthWest()
            ]);
            map.fitBounds(poly.getBounds());
            L.popup()
                .setLatLng(e.geocode.center)
                .setContent(e.geocode.name)
                .openOn(map);
        })
        .addTo(map);

        // 2. محرك البحث المحلي داخل البلوكات والعناصر الخاصة بك
        var searchControl = new L.Control.Search({
            layer: searchLayer,
            propertyName: 'title',
            initial: false,
            zoom: 17,
            marker: false,
            position: 'topright',
            textPlaceholder: '🧩 بحث في البلوكات/البيانات...'
        });
        map.addControl(searchControl);

        // زر التحديد المباشر للموقع
        var userMarker;
        function locateUser() {
            map.locate({setView: true, maxZoom: 17});
        }

        map.on('locationfound', function(e) {
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker(e.latlng).addTo(map).bindPopup("أنت هنا حالياً").openPopup();
        });

        map.on('locationerror', function() {
            alert("يرجى تفعيل الـ GPS والسماح للمتصفح بالوصول للموقع.");
        });
    </script>
</body>
</html>
