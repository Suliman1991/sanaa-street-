<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة صنعاء التفاعلية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة والتركيز على صنعاء
        var map = L.map('map').setView([15.369444, 44.191007], 13);

        // إضافة طبقة الصور الفضائية من Google Satellite
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Google Satellite'
        }).addTo(map);

        // قائمة ملفات البيانات الموجودة في مستودعك
        var files = ['2.json', '4.json', '5f.json', '6.json', '7.json'];
        
        // تحميل ورسم البيانات الجغرافية على الخريطة
        files.forEach(function(file) {
            fetch(file)
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: { color: "#ff7800", weight: 2, opacity: 0.8 },
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                var popupContent = "<table border='1' style='border-collapse:collapse; width:100%;'>";
                                for (var p in feature.properties) {
                                    popupContent += "<tr><th style='padding:4px; background:#f0f0f0;'>" + p + "</th><td style='padding:4px;'>" + feature.properties[p] + "</td></tr>";
                                }
                                popupContent += "</table>";
                                layer.bindPopup(popupContent);
                            }
                        }
                    }).addTo(map);
                }).catch(err => console.log('خطأ في تحميل الملف: ' + file, err));
        });
    </script>
</body>
</html>
