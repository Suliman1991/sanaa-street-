<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة صنعاء التفاعلية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.css" />
    
    <style>
        #map { height: 100vh; width: 100%; background: #222; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .locate-btn {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <button class="locate-btn" onclick="locateUser()">🎯 موقعي</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.js"></script>

    <script>
        var map = L.map('map', {
            preferCanvas: true
        }).setView([15.369444, 44.191007], 12);

        // خلفية Google Satellite
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Google Satellite'
        }).addTo(map);

        var searchFeaturesGroup = L.layerGroup().addTo(map);
        
        // القائمة الشاملة لجميع الملفات التسعة المرفوعة
        var files = ['2.json', '3a111.json', '3b111.json', '4.json', '5f.json', '6.json', '7.json', '8.json', '9.json'];

        // تحميل ملفات الـ GeoJSON الخاصة بك في محرك البحث المحلي
        function loadFilesSequentially(index) {
            if (index >= files.length) return;
            fetch(files[index])
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: { color: "#ff7800", weight: 1.5, opacity: 0.8 },
                        onEachFeature: function (feature, layer) {
                            var searchText = "";
                            if (feature.properties) {
                                var popupContent = "<table border='1' style='border-collapse:collapse; width:100%; font-size:11px;'>";
                                for (var p in feature.properties) {
                                    var val = feature.properties[p];
                                    searchText += val + " ";
                                    popupContent += "<tr><th style='padding:2px; background:#f0f0f0;'>" + p + "</th><td style='padding:2px;'>" + val + "</td></tr>";
                                }
                                popupContent += "</table>";
                                layer.bindPopup(popupContent);
                            }
                            layer.title = searchText.trim();
                            searchFeaturesGroup.addLayer(layer);
                        }
                    });
                    setTimeout(function() { loadFilesSequentially(index + 1); }, 150);
                })
                .catch(err => {
                    console.log('Error loading: ' + files[index], err);
                    loadFilesSequentially(index + 1);
                });
        }

        setTimeout(function() { loadFilesSequentially(0); }, 200);

        // أداة البحث الشامل
        var searchControl = new L.Control.Search({
            layer: searchFeaturesGroup,
            propertyName: 'title',
            initial: false,
            zoom: 16,
            marker: false,
            position: 'topright',
            textPlaceholder: '🔍 اكتب اسم المنطقة أو الحي...'
        });

        map.addControl(searchControl);

        // آلية التعامل مع الأسماء غير المسجلة في ملفاتك للوصول إليها مباشرة عبر الخريطة
        function queryExternalMap(searchTerm) {
            var cleanQuery = searchTerm.replace(/(حي|منطقة|شارع|حارة|محل)\s+/g, '').trim();
            var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&accept-language=ar&countrycodes=ye&q=' + encodeURIComponent(cleanQuery + " صنعاء");

            fetch(searchUrl)
                .then(res => res.json())
                .then(results => {
                    if (results && results.length > 0) {
                        var lat = results[0].lat;
                        var lon = results[0].lon;
                        map.setView([lat, lon], 16);
                        L.popup()
                            .setLatLng([lat, lon])
                            .setContent("<b>" + results[0].display_name + "</b>")
                            .openOn(map);
                    } else {
                        fetch('https://nominatim.openstreetmap.org/search?format=json&accept-language=ar&countrycodes=ye&q=' + encodeURIComponent(cleanQuery))
                            .then(res => res.json())
                            .then(res2 => {
                                if (res2 && res2.length > 0) {
                                    map.setView([res2[0].lat, res2[0].lon], 16);
                                    L.popup()
                                        .setLatLng([res2[0].lat, res2[0].lon])
                                        .setContent("<b>" + res2[0].display_name + "</b>")
                                        .openOn(map);
                                }
                            });
                    }
                });
        }

        // الاستجابة فور الضغط على زر Enter أو البحث
        setTimeout(function() {
            var searchInput = document.querySelector('.search-input');
            if (searchInput) {
                searchInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        var val = searchInput.value.trim();
                        if (val !== "") {
                            queryExternalMap(val);
                        }
                    }
                });
            }
        }, 1000);

        // تحديد موقع المستخدم
        var userMarker;
        function locateUser() {
            map.locate({setView: true, maxZoom: 17});
        }

        map.on('locationfound', function(e) {
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker(e.latlng).addTo(map).bindPopup("أنت هنا حالياً").openPopup();
        });

        map.on('locationerror', function() {
            alert("يرجى تفعيل الـ GPS والسماح للمتصفح بالوصول للموقع.");
        });
    </script>

    <!-- تسجيل الـ Service Worker للكاش والعمل بدون إنترنت -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('تم تفعيل وضع الأوفلاين الكاش بنجاح'))
                    .catch(err => console.log('خطأ في تفعيل الكاش:', err));
            });
        }
    </script>
</body>
</html>
